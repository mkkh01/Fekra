# إعدادات الجودة — تُستبعد القواعد التجميلية في هذه المرحلة
# حتى لا يطغى ضجيج إعادة التسمية على الإصلاحات الجوهرية.
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W"]      # أخطاء واقعية فقط (لا style)
ignore = ["E501",   # طول السطر: النصوص العربية تجعل الحد غير عملي
          "E741"]  # l/lo اصطلاح معتاد في شيفرة OHLC (low)

[lint.per-file-ignores]
"backtest/*" = ["E402", "F401"]
