# CT — نشر بضغطة واحدة على Render (Blueprint)
# ⚠️ المجدول يعمل داخل عامل ويب واحد فقط؛ لا ترفع WEB_CONCURRENCY فوق 1
#    وإلا تكرّرت حلقة المسح (كل عامل يستورد app.main ويبدأ مجدولاً).
services:
  - type: web
    name: ct-falcon
    runtime: python
    plan: starter            # المجانية تنام وتوقف الدورات — Starter إجباري لـ 24/7
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py app.main:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: WEB_CONCURRENCY
        value: 1
      - key: DATABASE_URL        # رابط Postgres (pooler)
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID       # اترك فارغاً للتسجيل التلقائي عبر /start أو اكتب المعرف يدوياً
        sync: false
      - key: ALLOW_AUTO_ADMIN
        value: 1
      - key: PUBLIC_URL
        sync: false
      - key: WEBHOOK_SECRET      # إجباري لحماية نقطة الويب هوك
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: SCAN_INTERVAL_SEC
        value: 60
      - key: MONITOR_INTERVAL_SEC
        value: 5
      - key: PAPER_EQUITY
        value: 10000
      - key: MAX_CONCURRENT
        value: 8
      - key: RUN_SCHEDULER
        value: 1
      - key: ENABLE_SNIPER
        value: 1          # المحرك الجديد فائق الدقة (Win Rate 91.8%)
      - key: ENABLE_DAY
        value: 0          # معطل بطلب المستخدم
      - key: ENABLE_FALCON
        value: 0          # معطل بطلب المستخدم
      - key: BREAKEVEN_ENABLED
        value: 0          # معطل لنظام SNIPER لمنع الخروج المبكر بالضوضاء السعرية
      - key: FUNDING_ENABLED
        value: 1
