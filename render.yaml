# CT — نشر بضغطة واحدة على Render (Blueprint)
# أو أنشئ Web Service يدوياً بنفس الأوامر والمتغيرات أدناه.
services:
  - type: web
    name: ct-falcon
    runtime: python
    plan: starter            # ⚠️ المجانية تنام وتوقف الدورات — Starter إجباري لـ 24/7
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 1 --bind 0.0.0.0:$PORT --timeout 180
    envVars:
      - key: SUPABASE_URL        # رابط Postgres (pooler) — من رسالتك
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BOT_TOKEN           # توكن بوت تيليغرام (رفعته أنت ✅)
        sync: false
      - key: ADMIN_CHAT_ID       # رقم شاتك — يُسجل تلقائياً عند أول /start إن تُرك فارغاً
        sync: false
      - key: PUBLIC_URL          # رابط الخدمة https://ct-falcon.onrender.com (للـ webhook)
        sync: false
      - key: SCAN_INTERVAL_SEC
        value: 60
      - key: PAPER_EQUITY
        value: 10000
      - key: RUN_SCHEDULER
        value: 1
