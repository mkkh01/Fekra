<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سِيَر الممالك — Chronicles of War</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1510;
      color: #e8dcc8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    #gameCanvas {
      display: block;
      background: linear-gradient(135deg, #2d2415 0%, #1a1510 100%);
    }
    #hud {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(30, 20, 10, 0.9);
      border: 2px solid #8b6f3a;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #hud h2 { color: #c9a84c; font-size: 16px; margin-bottom: 6px; }
    #hud .stat { display: flex; justify-content: space-between; gap: 20px; margin: 2px 0; }
    #hud .label { color: #a89870; }
    #hud .value { color: #e8dcc8; font-weight: bold; }
    #newsPanel {
      position: absolute;
      bottom: 10px; right: 10px; left: 10px;
      max-height: 140px;
      background: rgba(20, 15, 5, 0.92);
      border-top: 3px solid #8b6f3a;
      padding: 10px 16px;
      overflow-y: auto;
      font-size: 12px;
      border-radius: 6px 6px 0 0;
    }
    #newsPanel .news-item { margin: 3px 0; padding: 4px 0; border-bottom: 1px solid #3a2e1a; }
    #newsPanel .news-time { color: #8b6f3a; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <h2>سِيَر الممالك</h2>
    <div class="stat"><span class="label">السنة:</span> <span class="value" id="yearDisplay">1</span></div>
    <div class="stat"><span class="label">الذهب:</span> <span class="value" id="goldDisplay">0</span></div>
    <div class="stat"><span class="label">الغذاء:</span> <span class="value" id="foodDisplay">0</span></div>
    <div class="stat"><span class="label">الحروب:</span> <span class="value" id="warDisplay">0</span></div>
    <div class="stat"><span class="label">الدول:</span> <span class="value" id="nationDisplay">0</span></div>
  </div>
  <div id="newsPanel" aria-label="الأخبار"></div>

  <script type="module" src="./dist/core/main.js"></script>
</body>
</html>
